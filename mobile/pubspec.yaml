name: thd_student_discipline
description: Ung dung quan ly nen nep hoc sinh THPT Tran Hung Dao - Thanh Xuan
publish_to: none
version: 0.7.0+3
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  http_parser: ^4.1.1
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# The real third logo is installed via scripts/apply_branding.py.
# The build scripts run flutter_launcher_icons only when it is present.
flutter_launcher_icons:
  android: true
  ios: false
  adaptive_icon_background: "#FFFFFF"
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
